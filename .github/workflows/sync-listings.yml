name: Sync Listings from Google Sheet

on:
  schedule:
    - cron: '0 4 * * *'   # 8:00 AM Asia/Dubai (UTC+4) = 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sheet sync script
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: npm run sync:sheet

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- src/data/listings.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated listings
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "kabayan-space-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/listings.js
          git commit -m "chore: sync listings from Google Sheet [automated]"
          git push

      - name: Build production bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
